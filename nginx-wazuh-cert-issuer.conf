# /etc/nginx/conf.d/wazuh-cert-issuer.conf
#
# Terminates TLS, optionally verifies the client's Intune MDM device
# certificate, and proxies to gunicorn on 127.0.0.1:8080.
#
# The server cert here is NOT the Wazuh manager cert. Issue a separate one --
# easiest is to sign it with agents-rootCA so that the CA pem you already ship
# in the Intune package doubles as the trust anchor for this endpoint:
#
#   openssl req -new -nodes -newkey rsa:4096 \
#     -keyout issuer.key -out issuer.csr \
#     -subj "/C=US/CN=wazuh-enroll.corp.local" \
#     -addext "subjectAltName=DNS:wazuh-enroll.corp.local,IP:192.168.29.192"
#   openssl x509 -req -days 825 -in issuer.csr \
#     -CA agents-rootCA.pem -CAkey agents-rootCA.key -CAcreateserial \
#     -copy_extensions copyall -out issuer.crt
#
# -copy_extensions copyall matters: without it the SAN is dropped and modern
# TLS clients (including .NET / PowerShell) will reject the cert outright.

limit_req_zone $binary_remote_addr zone=enroll:10m rate=6r/m;

server {
    # Internal interface only. Do not put this on a public IP.
    listen 192.168.29.192:8443 ssl;
    server_name wazuh-enroll.corp.local;

    ssl_certificate     /etc/wazuh-cert-issuer/tls/issuer.crt;
    ssl_certificate_key /etc/wazuh-cert-issuer/tls/issuer.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5:!3DES;
    ssl_prefer_server_ciphers on;

    # ---- Optional: mutual TLS against the Intune MDM device CA ----
    # Export "Microsoft Intune MDM Device CA" from any enrolled device:
    #   Get-ChildItem Cert:\LocalMachine\My |
    #     Where-Object Issuer -like "*Intune MDM*" | Format-List Subject,Issuer
    # then export the issuing CA from Cert:\LocalMachine\CA and convert to PEM.
    # Set AUTH_MODE=mtls or AUTH_MODE=either on the app to actually enforce it.
    #
    # ssl_client_certificate /etc/wazuh-cert-issuer/tls/intune-mdm-device-ca.pem;
    # ssl_verify_client      optional;
    # ssl_verify_depth       3;

    client_max_body_size 8k;
    access_log /var/log/nginx/wazuh-cert-issuer.access.log;
    error_log  /var/log/nginx/wazuh-cert-issuer.error.log warn;

    location = /healthz {
        proxy_pass http://127.0.0.1:8080;
    }

    location = /v1/agent-bootstrap {
        limit_req zone=enroll burst=3 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # These two are what the app reads for mTLS auth. Setting them
        # unconditionally here is what stops a client from forging them:
        # whatever the client sent is overwritten by nginx's own verdict.
        proxy_set_header X-Client-Verify $ssl_client_verify;
        proxy_set_header X-Client-CN     $ssl_client_s_dn_cn;
    }

    location / {
        return 404;
    }
}
